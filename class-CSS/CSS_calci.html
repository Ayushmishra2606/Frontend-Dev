<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HTML & CSS Calculator</title>
    <style>
      html,body {
        height: 100%;
        margin: 0;
        background: wheat;
        display: grid;
        place-items: center;
        padding: 40px;
      }
      .calculator {
        width: 320px;
        background: #1f2933;
        border-radius: 24px;
        box-shadow: 0 6px 18px rgba(12, 20, 30, 0.25);
        padding: 22px;
        color: #e6eef9;
      }
      .screen {
        height: 74px;
        background: #42505e;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 16px;
        font-size: 28px;
        font-weight: 600;
        color: #ffffff;
        letter-spacing: 1px;
        margin-bottom: 18px;
        box-shadow: inset 0 -6px 18px rgba(0, 0, 0, 0.35);
      }
      .keys {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }

      button.key {
        border: 0;
        height: 56px;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.12s ease;
        box-shadow: 0 6px 12px rgba(3, 8, 14, 0.28);
        background: #2f3a44;
        color: #dbe8ff;
      }

      button.key:hover {
        transform: translateY(-4px) scale(1.01);
        box-shadow: 0 12px 22px rgba(3, 8, 14, 0.32);
      }

      button.key.top {
        color:rgb(34, 34, 34);
        background-color: #b8d3ff;
        font-weight: 700;
      }

      button.key.op {
        background: #f57226;
        color: white;
      }

      button.key.zero {
        grid-column: 1 / span 2;
        text-align: left;
        padding-left: 20px;
      }

      .secondary {
        font-size: 12px;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div class="calculator" role="application" aria-label="css calculator">
      <div class="screen" id="display">0</div>
      <div class="keys">
        <button class="key top">AC</button>
        <button class="key top">+/-</button>
        <button class="key top">%</button>
        <button class="key op">÷</button>

        <button class="key">7</button>
        <button class="key">8</button>
        <button class="key">9</button>
        <button class="key op">×</button>

        <button class="key">4</button>
        <button class="key">5</button>
        <button class="key">6</button>
        <button class="key op">−</button>

        <button class="key">1</button>
        <button class="key">2</button>
        <button class="key">3</button>
        <button class="key op">+</button>

        <button class="key zero">0</button>
        <button class="key">.</button>
        <button class="key op">=</button>
      </div>
    </div>
  </body>
</html>
